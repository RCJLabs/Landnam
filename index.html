nd the wrist, a twist of gold wire.",weight:9,when:[{c:"terrain",any:["bog"]}],choices:[{label:"Take the gold",check:{stat:"spirit",dc:13},success:{text:"We took the ring and covered the hand again. Nothing came of it, whatever the others said.",effects:[{t:"morale",n:-4},{t:"flag",flag:"tookBogGold",n:1}]},failure:{text:"The peat gave way. One of us went in to the chest and came out grey and shaking.",effects:[{t:"wound",n:5},{t:"morale",n:-8}]}},{label:"Cover it over",success:{text:"We pressed the peat back over the hand and said the words we could remember.",effects:[{t:"morale",n:3}]}}]},{id:"salmon-run",title:"The River Boils",body:"The shallows are thick with salmon running upstream, so many that the water looks like it is being rained on from below.",weight:10,when:[{c:"nearWater"},{c:"season",any:["summer","autumn"]}],choices:[{label:"Weir the shallows",check:{stat:"craft",dc:11},success:{text:"We stoned a weir across the narrows and took fish until our arms ached.",effects:[{t:"food",n:12},{t:"morale",n:5}]},failure:{text:"The weir washed out twice and we gave it up with little to show.",effects:[{t:"food",n:3}]}},{label:"Spear what we can and move on",success:{text:"We speared what we could reach and carried it wet.",effects:[{t:"food",n:5}]}}]},{id:"burnt-steading",title:"A Burnt Steading",body:"A longhouse, or what is left of one. The turf roof has fallen in and the timbers are charred. The burning was not recent, and it was not an accident.",weight:8,once:!0,when:[{c:"terrain",any:["meadow","valley","shore"]},{c:"dayMin",day:6}],choices:[{label:"Search the wreck",check:{stat:"wits",dc:11},success:{text:"Under a fallen beam we found a grain pit the fire had missed.",effects:[{t:"food",n:8},{t:"firewood",n:3}]},failure:{text:"We turned over black timber for half a day and found only black timber.",effects:[{t:"morale",n:-3}]}},{label:"Take the standing timber",success:{text:"We pulled down what would still burn and carried it out.",effects:[{t:"firewood",n:6},{t:"morale",n:-2}]}},{label:"Leave it be — someone did this",success:{text:"We left the steading to its ghosts, and kept a better watch after.",effects:[{t:"flag",flag:"wary",n:1},{t:"morale",n:-1}]}}]},{id:"strangers-smoke",title:"Smoke to the North",body:"A thread of smoke, too straight and too steady to be anything but a hearth. Someone else is wintering on this coast.",weight:7,once:!0,when:[{c:"dayMin",day:10}],choices:[{label:"Go and speak with them",check:{stat:"spirit",dc:12},success:{text:"They were few and as frightened as we were. We traded words, and they gave us grain to be rid of us.",effects:[{t:"food",n:7},{t:"morale",n:5}]},failure:{text:"They would not open the door, and something was nocked to a string behind it. We withdrew.",effects:[{t:"morale",n:-4},{t:"flag",flag:"wary",n:1}]}},{label:"Mark it and stay clear",success:{text:"We noted where the smoke rose and went nowhere near it.",effects:[{t:"flag",flag:"wary",n:1}]}}]},{id:"scouts",title:"Watchers at the Treeline",body:"Two men at the edge of the wood, armed, making no attempt to hide. They watch us pass, and then they are not there.",weight:7,when:[{c:"dayMin",day:12},{c:"terrain",any:["forest","hills","meadow","valley"]}],choices:[{label:"Hail them",check:{stat:"spirit",dc:13},success:{text:"They came out and spoke. We learned the shape of the land, and whose it was.",effects:[{t:"reveal",radius:4},{t:"morale",n:3}]},failure:{text:"They melted into the trees without a word. We slept badly.",effects:[{t:"morale",n:-5},{t:"flag",flag:"wary",n:1}]}},{label:"Take them before they carry word",success:{text:"We went into the trees after them, and they did not run far.",effects:[{t:"battle",difficulty:-1}]}},{label:"Keep walking, weapons loose",success:{text:"We walked on with our hands near our axes and nothing came of it.",effects:[{t:"flag",flag:"wary",n:1}]}}]},{id:"landing-party",title:"Another Keel on the Sand",body:"A ship drawn up where ours should be, and men around a fire who stand when they see us. They have the same look we do: too far from home, and not going back empty.",weight:9,when:[{c:"dayMin",day:7},{c:"terrain",any:["shore","meadow","valley"]}],choices:[{label:"Go at them",success:{text:"No words were wasted. We went down the sand at them.",effects:[{t:"battle",difficulty:1}]}},{label:"Try to treat with them",check:{stat:"spirit",dc:12},success:{text:"Their leader heard us out. We parted with the coast divided between us, after a fashion.",effects:[{t:"morale",n:5},{t:"flag",flag:"wary",n:1}]},failure:{text:"Someone reached for an axe, and after that there was nothing to say.",effects:[{t:"battle",difficulty:1}]}},{label:"Withdraw before they count us",check:{stat:"wits",dc:11},success:{text:"We went back the way we came, quietly, and they never followed.",effects:[{t:"morale",n:-3}]},failure:{text:"They saw us go, and they were faster than we were.",effects:[{t:"battle",difficulty:0}]}}]},{id:"wolves-press",title:"The Pack Comes In",body:"The wolves that shadowed us have stopped shadowing. They are between us and the open ground, and they are not pacing any more.",weight:7,when:[{c:"dayMin",day:14},{c:"terrain",any:["forest","hills","bog"]}],choices:[{label:"Set our backs together and meet them",success:{text:"We put our backs together and let them come.",effects:[{t:"battle",difficulty:-1}]}},{label:"Fire and noise",check:{stat:"craft",dc:12},success:{text:"Burning brands and shouting. They went, grudging every step.",effects:[{t:"firewood",n:-2},{t:"morale",n:2}]},failure:{text:"The brands guttered in the wet and the pack came on anyway.",effects:[{t:"firewood",n:-2},{t:"battle",difficulty:0}]}}]},{id:"ravens",title:"Two Ravens",body:"They come down and sit on the same dead branch, and neither of them makes a sound. Everyone has stopped walking.",weight:6,when:[{c:"dayMin",day:8}],choices:[{label:"Call it a good omen",success:{text:"We said aloud that it was a good sign, and it became one.",effects:[{t:"morale",n:6}]}},{label:"Say nothing at all",success:{text:"Nobody said what everyone was thinking. The ravens left before we did.",effects:[{t:"morale",n:-2}]}}]},{id:"fever",title:"A Fever in the Camp",body:"One of the band woke shaking and could not get warm. By evening they could not stand.",weight:8,when:[{c:"dayMin",day:9}],choices:[{label:"Halt and tend them",check:{stat:"craft",dc:11},success:{text:"We lost two days to it, but the fever broke and they walked out on their own feet.",effects:[{t:"heal",n:3},{t:"food",n:-3}]},failure:{text:"Nothing we knew to do made any difference. It ran its course and left them hollowed out.",effects:[{t:"injure"},{t:"morale",n:-5}]}},{label:"Carry them and keep moving",check:{stat:"might",dc:12},success:{text:"We took turns carrying them and did not stop. They mended on the move.",effects:[{t:"morale",n:-2}]},failure:{text:"Carrying them cost us more than the days would have. Two more went down with it.",effects:[{t:"wound",n:3,count:2},{t:"morale",n:-6}]}}]},{id:"cave",title:"A Dry Cave",body:"A cleft in the rock, deeper than it looks, with a floor of dry sand and an old ring of fire-blackened stones.",weight:9,when:[{c:"terrain",any:["hills","mountains"]}],choices:[{label:"Shelter here for the night",success:{text:"We slept dry and out of the wind, which we had not done in some time.",effects:[{t:"heal",n:2},{t:"morale",n:6},{t:"firewood",n:-1}]}},{label:"Search the back of it",check:{stat:"wits",dc:12},success:{text:"Someone had cached food here against a hard season, and never come back for it.",effects:[{t:"food",n:7},{t:"morale",n:3}]},failure:{text:"The passage narrowed to nothing. We came out scraped and no richer.",effects:[{t:"wound",n:2}]}}]},{id:"quarrel",title:"Words at the Fire",body:"It starts over a share of food and it is not about the food. Two of them are on their feet, and the rest are choosing sides.",weight:14,when:[{c:"moraleMax",value:40}],choices:[{label:"Put a stop to it",check:{stat:"spirit",dc:12},success:{text:"It was set ear day in a fortnight, and the talk in the hall has gone quiet and strange.",weight:14,when:[{c:"season",any:["winter"]},{c:"settled"}],choices:[{label:"Keep everyone to a routine",check:{stat:"spirit",dc:12},success:{text:"We set hours and kept them, dark or not. It held the shape of the days together.",effects:[{t:"morale",n:6}]},failure:{text:"The hours slipped. People slept when they liked and stopped speaking at meals.",effects:[{t:"morale",n:-7}]}},{label:"Burn wood and tell stories",success:{text:"We built the fire past what it needed and talked until it burned low. Worth it.",effects:[{t:"firewood",n:-4},{t:"morale",n:9}]}}]},{id:"lung-sickness",title:"It Goes Through the Hall",body:"It starts as one cough in the night and by the third day half the hall has it. The smoke does not help. Nothing helps.",weight:15,when:[{c:"season",any:["winter"]},{c:"settled"},{c:"sick"}],choices:[{label:"Nurse them and burn wood to keep the hall warm",success:{text:"We kept the fire high and sat with them in turns. Most of it passed.",effects:[{t:"firewood",n:-6},{t:"heal",n:4},{t:"morale",n:2}]}},{label:"Brew what the old ones brewed",check:{stat:"craft",dc:13},success:{text:"Bitter, and it worked. They were sitting up in two days.",effects:[{t:"heal",n:6},{t:"morale",n:4}]},failure:{text:"Whatever it was, it did nothing but make them sicker for a night.",effects:[{t:"wound",n:3,count:3},{t:"morale",n:-4}]}}]},{id:"empty-store",title:"The Bottom of the Store",body:"Someone comes back from the store with an honest face and says what everyone already knew. There is less in there than there should be, and it is a long way to spring.",weight:16,when:[{c:"season",any:["winter"]},{c:"settled"},{c:"foodMax",value:14}],choices:[{label:"Cut the ration and say so plainly",check:{stat:"spirit",dc:12},success:{text:"Half rations, announced to everyone at once. Nobody liked it. Nobody argued.",effects:[{t:"food",n:4},{t:"morale",n:-4}]},failure:{text:"The cut was announced badly and tak
