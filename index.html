 can call a Thing — and be made jarls of a country that had no name for itself.",point:"Settle before winter. Survive two of them. Call the Thing. Everything else serves that.",when:[{c:"dayMin",day:2}]},{id:"the-day",title:"The First Day",body:"Six of you came off the knarr with what you could carry, and the country in front of you is nobody's. Every hex you cross is a day of your life, and the days are what run out first.",point:"Tap a marked hex to walk. Tap Act for everything else you can do with a day.",when:[{c:"dayMin",day:2}]},{id:"the-store",title:"The Store",body:"The sacks came down faster than anyone had reckoned on. Six people eat whether the day went well or badly, and a night without a fire costs more than a day without food.",point:"Forage, hunt and fish put food back. Camp gathers firewood. Both cost the day.",when:[{c:"foodMax",value:12}]},{id:"the-ground",title:"Ground Worth Holding",body:"This is the kind of place a man could put posts in. The reading under the map is what the land is actually good for — and no two good things ever come together, so the choice is which lack you can live with.",point:"Founding is one way and there is no second steading. Without fresh water it is refused outright.",when:[{c:"canSettle"}]},{id:"the-mark",title:"The Mark",body:"The light is going earlier and the old hands have started counting sacks out loud. What the mark shows is not a rule of thumb — it walks every remaining day with your people on their jobs and tells you what the stores must reach.",point:"Reach the mark before the dark. A band that ignores it usually does not see spring.",when:[{c:"markVisible"}]},{id:"the-work",title:"The Work",body:"The posts are in, and from here the steading is where the band lives. Everyone gets a job or wastes the day, and the ground decides which jobs are worth anything: you cannot farm a crag or cut timber on a shore.",point:"Give everyone work. Queue what you lack. Builders turn timber into what the winter cannot take.",when:[{c:"inColony"}]},{id:"the-line",title:"The Line",body:"They came on faster than anyone could form up. A man alone with his shield is a man being flanked; two standing shoulder to shoulder are worth more than three scattered across the field.",point:"Stand your people next to each other. The wall is worth more than any single blow.",when:[{c:"inBattle"}]},{id:"the-road",title:"The Road Out",body:"They took provisions and went, and the steading closed up behind them. Whoever stayed works every day they are gone, and whoever went is the only part of the band the country can reach.",point:"A hall whose warriors are three days out is the one worth raiding. Send what you can spare.",when:[{c:"away"}]},{id:"the-quarrel",title:"Bad Blood",body:"It started over nothing, the way these things do, and by the second week nobody was pretending otherwise. Hunger and cold and bad work make quarrels; the quarrels do not go away because the weather improved.",point:"Settle it, or it comes to knives. A quarrel the band refused to name hardens instead of fading.",when:[{c:"grudge"}]},{id:"the-hands",title:"Hands",body:"They came with nothing and were put to work by noon. A hand is not sworn: they hold jobs, eat at the fire, and need a bed under a roof — and they never stand in the line, because six came off the knarr and six is the line. A hand who is miserable long enough walks out.",point:"Growth buys labour, never a wider wall. Build room before you take people in, and keep their hearts up.",when:[{c:"hasHands"}]},{id:"the-place",title:"Somewhere That Is Somewhere",body:"The country is not empty. A house of the White Christ, a trading town, a wreck, a seam of iron — places worth walking to, and some worth taking. What is taken is taken once, and word of an armed band travels faster than the band does.",point:"Open Act while standing on a place to take what it holds. The guarded ones pay best and cost most.",when:[{c:"atPlace"}]},{id:"the-hull",title:"What the Sea Took",body:
