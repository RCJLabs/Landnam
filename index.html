",success:{text:"We pressed the peat back over the hand and said the words we could remember.",effects:[{t:"morale",n:3}]}}]},{id:"salmon-run",title:"The River Boils",body:"The shallows are thick with salmon running upstream, so many that the water looks like it is being rained on from below.",weight:10,when:[{c:"nearWater"},{c:"season",any:["summer","autumn"]}],choices:[{label:"Weir the shallows",check:{stat:"craft",dc:11},success:{text:"We stoned a weir across the narrows and took fish until our arms ached.",effects:[{t:"food",n:12},{t:"morale",n:5}]},failure:{text:"The weir washed out twice and we gave it up with little to show.",effects:[{t:"food",n:3}]}},{label:"Spear what we can and move on",success:{text:"We speared what we could reach and carried it wet.",effects:[{t:"food",n:5}]}}]},{id:"burnt-steading",title:"A Burnt Steading",body:"A longhouse, or what is left of one. The turf roof has fallen in and the timbers are charred. The burning was not recent, and it was not an accident.",weight:8,once:!0,when:[{c:"terrain",any:["meadow","valley","shore"]},{c:"dayMin",day:6}],choices:[{label:"Search the wreck",check:{stat:"wits",dc:11},success:{text:"Under a fallen beam we found a grain pit the fire had missed.",effects:[{t:"food",n:8},{t:"firewood",n:3}]},failure:{text:"We turned over black timber for half a day and found only black timber.",effects:[{t:"morale",n:-3}]}},{label:"Take the standing timber",success:{text:"We pulled down what would still burn and carried it out.",effects:[{t:"firewood",n:6},{t:"morale",n:-2}]}},{label:"Leave it be — someone did this",success:{text:"We left the steading to its ghosts, and kept a better watch after.",effects:[{t:"flag",flag:"wary",n:1},{t:"morale",n:-1}]}}]},{id:"strangers-smoke",title:"Smoke to the North",body:"A thread of smoke, too straight and too steady to be anything but a hearth. Someone else is wintering on this coast.",weight:7,once:!0,when:[{c:"dayMin",day:10}],choices:[{label:"Go and speak with them",check:{stat:"spirit",dc:12},success:{text:"They were few and as frightened as we were. We traded words, and they gave us grain to be rid of us.",effects:[{t:"food",n:7},{t:"morale",n:5}]},failure:{text:"They would not open the door, and something was nocked to a string behind it. We withdrew.",effects:[{t:"morale",n:-4},{t:"flag",flag:"wary",n:1}]}},{label:"Mark it and stay clear",success:{text:"We noted where the smoke rose and went nowhere near it.",effects:[{t:"flag",flag:"wary",n:1}]}}]},{id:"scouts",title:"Watchers at the Treeline",body:"Two men at the edge of the wood, armed, making no attempt to hide. They watch us pass, and then they are not there.",weight:7,when:[{c:"dayMin",day:12},{c:"terrain",any:["forest","hills","meadow","valley"]}],choices:[{label:"Hail them",check:{stat:"spirit",dc:13},success:{text:"They came out and spoke. We learned the shape of the land, and whose it was.",effects:[{t:"reveal",radius:4},{t:"morale",n:3}]},failure:{text:"They melted into the trees without a word. We slept badly.",effects:[{t:"morale",n:-5},{t:"flag",flag:"wary",n:1}]}},{label:"Take them before they carry word",success:{text:"We went into the trees after them, and they did not run far.",effects:[{t:"battle",difficulty:-1}]}},{label:"Keep walking, weapons loose",success:{text:"We walked on with our hands near our axes and nothing came of it.",effects:[{t:"flag",flag:"wary",n:1}]}}]},{id:"landing-party",title:"Another Keel on the Sand",body:"A ship drawn up where ours should be, and men around a fire who stand when they see us. They have the same look we do: too far from home, and not going back empty.",weight:9,when:[{c:"dayMin",day:7},{c:"terrain",any:["shore","meadow","valley"]}],choices:[{label:"Go at them",success:{text:"No words were wasted. We went down the sand at them.",effects:[{t:"battle",difficulty:1}]}},{label:"Try to treat with them",check:{stat:"spirit",dc:12},success:{text:"Their leader heard us out. We parted with the coast divided between us, after a fashi
