t the water looks like it is being rained on from below.",weight:10,when:[{c:"nearWater"},{c:"season",any:["summer","autumn"]}],choices:[{label:"Weir the shallows",check:{stat:"craft",dc:11},success:{text:"We stoned a weir across the narrows and took fish until our arms ached.",effects:[{t:"food",n:12},{t:"morale",n:5}]},failure:{text:"The weir washed out twice and we gave it up with little to show.",effects:[{t:"food",n:3}]}},{label:"Spear what we can and move on",success:{text:"We speared what we could reach and carried it wet.",effects:[{t:"food",n:5}]}}]},{id:"burnt-steading",title:"A Burnt Steading",body:"A longhouse, or what is left of one. The turf roof has fallen in and the timbers are charred. The burning was not recent, and it was not an accident.",weight:8,once:!0,when:[{c:"terrain",any:["meadow","valley","shore"]},{c:"dayMin",day:6}],choices:[{label:"Search the wreck",check:{stat:"wits",dc:11},success:{text:"Under a fallen beam we found a grain pit the fire had missed.",effects:[{t:"food",n:8},{t:"firewood",n:3}]},failure:{text:"We turned over black timber for half a day and found only black timber.",effects:[{t:"morale",n:-3}]}},{label:"Take the standing timber",success:{text:"We pulled down what would still burn and carried it out.",effects:[{t:"firewood",n:6},{t:"morale",n:-2}]}},{label:"Leave it be — someone did this",success:{text:"We left the steading to its ghosts, and kept a better watch after.",effects:[{t:"flag",flag:"wary",n:1},{t:"morale",n:-1}]}}]},{id:"strangers-smoke",title:"Smoke to the North",body:"A thread of smoke, too straight and too steady to be anything but a hearth. Someone else is wintering on this coast.",weight:7,once:!0,when:[{c:"dayMin",day:10}],choices:[{label:"Go and speak with them",check:{stat:"spirit",dc:12},success:{text:"They were few and as frightened as we were. We traded words, and they gave us grain to be rid of us.",effects:[{t:"food",n:7},{t:"morale",n:5}]},failure:{text:"They would not open the door, and something was nocked to a string behind it. We withdrew.",effects:[{t:"morale",n:-4},{t:"flag",flag:"wary",n:1}]}},{label:"Mark it and stay clear",success:{text:"We noted where the smoke rose and went nowhere near it.",effects:[{t:"flag",flag:"wary",n:1}]}}]},{id:"scouts",title:"Watchers at the Treeline",body:"Two men at the edge of the wood, armed, making no attempt to hide. They watch us pass, and then they are not there.",weight:7,when:[{c:"dayMin",day:12},{c:"terrain",any:["forest","hills","meadow","valley"]}],choices:[{label:"Hail them",check:{stat:"spirit",dc:13},success:{text:"They came out and spoke. We learned the shape of the land, and whose it was.",effects:[{t:"reveal",radius:4},{t:"morale",n:3}]},failure:{text:"They melted into the trees without a word. We slept badly.",effects:[{t:"morale",n:-5},{t:"flag",flag:"wary",n:1}]}},{label:"Take them before they carry word",success:{text:"We went into the trees after them, and they did not run far.",effects:[{t:"battle",difficulty:-1}]}},{label:"Keep walking, weapons loose",success:{text:"We walked on with our hands near our axes and nothing came of it.",effects:[{t:"flag",flag:"wary",n:1}]}}]},{id:"landing-party",title:"Another Keel on the Sand",body:"A ship drawn up where ours should be, and men around a fire who stand when they see us. They have the same look we do: too far from home, and not going back empty.",weight:9,when:[{c:"dayMin",day:7},{c:"terrain",any:["shore","meadow","valley"]}],choices:[{label:"Go at them",success:{text:"No words were wasted. We went down the sand at them.",effects:[{t:"battle",difficulty:1}]}},{label:"Try to treat with them",check:{stat:"spirit",dc:12},success:{text:"Their leader heard us out. We parted with the coast divided between us, after a fashion.",effects:[{t:"morale",n:5},{t:"flag",flag:"wary",n:1}]},failure:{text:"Someone reached for an axe, and after that there was nothing to say.",effects:[{t:"battle",difficulty:1}]}},{label:"Withdraw before they count us",check:{stat:"wits",dc:11},success:{text:"We went back the way we came, quietly, and they never followed.",effects:[{t:"morale",n:-3}]},failure:{text:"They saw us go, and they were faster than we were.",effects:[{t:"battle",difficulty:0}]}}]},{id:"wolves-press",title:"The Pack Comes In",body:"The wolves that shadowed us have stopped shadowing. They are between us and the open ground, and they are not pacing any more.",weight:7,when:[{c:"dayMin",day:14},{c:"terrain",any:["forest","hills","bog"]}],choices:[{label:"Set our backs together and meet them",success:{text:"We put our backs together and let them come.",effects:[{t:"battle",difficulty:-1}]}},{label:"Fire and noise",check:{stat:"craft",dc:12},success:{text:"Burning brands and shouting. They went, grudging every step.",effects:[{t:"firewood",n:-2},{t:"morale",n:2}]},failure:{text:"The brands guttered in the wet and the pack came on anyway.",effects:[{t:"firewood",n:-2},{t:"battle",difficulty:0}]}}]},{id:"ravens",title:"Two Ravens",body:"They come down and sit on the same dead branch, and neither of them makes a sound. Everyone has stopped walking.",weight:6,when:[{c:"dayMin",day:8}],choices:[{label:"Call it a good omen",success:{text:"We said aloud that it was a good sign, and it became one.",effects:[{t:"morale",n:6}]}},{label:"Say nothing at all",success:{text:"Nobody said what everyone was thinking. The ravens left before we did.",effects:[{t:"morale",n:-2}]}}]},{id:"fever",title:"A Fever in the Camp",body:"One of the band woke shaking and could not get warm. By evening they could not stand.",weight:8,when:[{c:"dayMin",day:9}],choices:[{label:"Halt and tend them",check:{stat:"craft",dc:11},success:{text:"We lost two days to it, but the fever broke and they walked out on their own feet.",effects:[{t:"heal",n:3},{t:"food",n:-3}]},failure:{text:"Nothing we knew to do made any difference. It ran its course and left them hollowed out.",effects:[{t:"injure"},{t:"morale",n:-5}]}},{label:"Carry them and keep moving",check:{stat:"mig  and carry all we can",check:{stat:"might",dc:11},success:{text:"We worked it for two days and carried away more than we thought we could.",effects:[{t:"food",n:20},{t:"morale",n:10}]},failure:{text:"We worked until the tide turned and lost most of it to the water and the birds.",effects:[{t:"food",n:7},{t:"morale",n:2}]}},{label:"Take a little and go",success:{text:"We took what we could carry easily and left the rest to the gulls.",effects:[{t:"food",n:6}]}}]},{id:"hard-frost",title:"The Frost Comes Early",body:"The ground rings underfoot and the last of the standing water has gone hard. It is too early for this.",weight:12,when:[{c:"season",any:["winter"]}],choices:[{label:"Build the fire high and hold",success:{text:"We burned more than we could spare, and lived through the night for it.",effects:[{t:"firewood",n:-4},{t:"morale",n:2}]}},{label:"Keep moving to stay warm",check:{stat:"spirit",dc:14},success:{text:"We walked through the worst of it and were warmer for walking.",effects:[{t:"morale",n:-1}]},failure:{text:"The cold got into all of us. One went down and did not get up quickly.",effects:[{t:"wound",n:4,count:3},{t:"morale",n:-7}]}}]}];function qn(e){return Tt.find(t=>t.id===e)}const Xe=300;function E(e,t,n="plain"){e.saga[e.saga.length-1]?.text!==t&&(e.saga.push({day:e.day,text:t,tone:n}),e.saga.length>Xe&&e.saga.splice(0,e.saga.length-Xe))}const le=7,ee=9,Ze=[ee-2,ee-1],Je=[0,1],Qe={ocean:{rough:0,block:0,water:0},shore:{rough:.12,block:.03,water:.1},meadow:{rough:.08,block:.02,water:0},forest:{rough:.2,block:.16,water:0},hills:{rough:.26,block:.1,water:0},mountains:{rough:.3,block:.22,water:0},bog:{rough:.42,block:.04,water:.12},valley:{rough:.1,block:.03,water:.04}};function Et(e){switch(e){case"open":return 1;case"rough":return 2;default:return 1/0}}function Le(e){return Number.isFinite(Et(e))}function Vn(e,t){const n=Qe[e]??Qe.meadow,o={},r=[],a=[];for(let s=0;s<ee;s++)for(let i=0;i<le;i++){const l=we(i,s),c=Ze.includes(s)||Je.includes(s);let d="o
