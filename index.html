ad walked through the whole corner.",effects:[{t:"food",n:-8},{t:"morale",n:-3}]}}]},{id:"the-drift-net",title:"Somebody's Net, Nobody's Fish",body:"A torn net is coming down the tide, floats and all, and it is heavy with a catch nobody stayed to claim. Whatever tore it loose from its owner had weather in it.",weight:6,when:[{c:"terrain",any:["shore","ocean"]}],choices:[{label:"Haul it in",check:{stat:"might",dc:11},success:{text:"It came in fighting the whole way, full of fish and weed and one very angry crab. The net will mend; the catch went on the racks.",effects:[{t:"food",n:6}]},failure:{text:"It wrapped a leg on the third pull and nearly took its haulier with it down the tide. We cut it free and watched it go.",effects:[{t:"wound",n:3},{t:"morale",n:-2}]}},{label:"Let the sea keep what it took",success:{text:"It went past and out, floats winking. Somebody up-coast is poorer tonight, and it is not us, and it could have been.",effects:[{t:"morale",n:-1}]}}]},{id:"the-white-owl",title:"The White Owl",body:"It has taken to hunting the in-field at dusk, white as washed wool and silent as the inside of a drum. Every head in the steading turns to watch it. Nobody agrees on what it means.",weight:5,when:[{c:"settled"},{c:"season",any:["winter"]}],choices:[{label:"Call it good hunting and a clean winter",success:{text:"It was said aloud at the fire — an owl that fat means mice, and mice mean grain, and grain means we are richer than we feel. The hall chose to believe it.",effects:[{t:"morale",n:5}]}},{label:"Say nothing and count heads",success:{text:"Somebody said, too quietly and not quietly enough, whose face it had. It was nobody's face. It was an owl. The saying still sat at the fire all evening.",effects:[{t:"morale",n:-4}]}}]},{id:"a-lean-sail",title:"A Lean Sail Closing",body:"She has been on the same tack as us for an hour and she is faster. A crew that eats shows it in the rowing; this one rows like men who have not, and they are not closing to trade news.",weight:14,when:[{c:"afloat"},{c:"dayMin",day:5}],choices:[{label:"Ship oars and let them come alongside",success:{text:"We took the way off her and got the shields up along the rail. They came on.",effects:[{t:"battle",difficulty:0}]}},{label:"Throw them meat and pull away",success:{text:"A sack went over the side and they stopped for it, which told everyone what kind of winter they were having.",effects:[{t:"food",n:-5},{t:"morale",n:-2}]}},{label:"Race them for the shallows",check:{stat:"might",dc:12},success:{text:"We pulled until the oars bent and took her in over sand they did not dare follow across.",effects:[{t:"morale",n:4}]},failure:{text:"They had the legs of us, and we met them tired.",effects:[{t:"battle",difficulty:1}]}}]},{id:"the-cold-forge",title:"The Forge Stands Cold",body:"The band knows iron now, and knowing is not burning: the charcoal is gone, and bog-ore is patient in a way that edges are not. Every dull axe in the steading has an opinion.",weight:6,when:[{c:"settled"},{c:"known",lore:"smithing"}],choices:[{label:"Burn a stack down to charcoal",success:{text:"A turf-covered stack, three days of smoke and judgement, and sacks of good black charcoal at the end of it. The forge rang again the same evening.",effects:[{t:"firewood",n:-8},{t:"morale",n:3}]}},{label:"Let it stand cold till there is wood to spare",success:{text:"The smith's hands went back to hauling and the whetstone did what it could. Everything cuts a little worse than it ought to.",effects:[{t:"morale",n:-3}]}}]}];function mc(e){return go.find(t=>t.id===e)}const _a=[{id:"scout",kind:"Scout",budget:6,favours:["wits","wits","spirit"],toughness:-2,temperament:"cautious",throws:2,weight:10,renown:0},{id:"raider",kind:"Raider",budget:8,favours:["might","might","spirit"],toughness:0,temperament:"aggressive",throws:1,weight:12,renown:1},{id:"skirmisher",kind:"Skirmisher",budget:8,favours:["wits","might","spirit"],toughness:-1,temperament:"flanker",throws:1,weight:9,renown:0},{id:"huscarl es back over a season, so a band that lives this way works a circuit. The angriest neighbour is where raids come from, and a raid always names its sender."},{id:"the-places",title:"Places",body:"The map holds fixed places: a monastery, a trading town, a wreck and an iron seam. They are on this coast, not across the world — but you must LEARN of them, by walking past or by hearing of one from somebody you trade with. Stand on one and Act offers what it will do for you. The town keeps a market and deals both ways; the house will sell you bread for firewood. Steel is the OTHER option, and it is final: a place is taken once, and a place you have taken has nobody left to deal with."},{id:"the-sea",title:"The Sea",body:"The knarr rows coastal water — sea with land in sight — faster than legs walk. Fights afloat are fought hull to hull, and losing one puts cargo over the side and holes the hull; camp ashore a night to mend her. Afloat beside a guarded place you may fall on it FROM THE SHIP: they do not watch the water, so they are fewer and shaken, and the hold carries half again what backs could — but losing costs the cargo and the hull. The nets are best at sea, and there is no forage out there."},{id:"the-long-game",title:"The Long Game",body:"Stand long enough, or take enough, and word travels: harder men come looking, in bigger numbers. Growth answers it — hands to work, walls to hold, friends to call on. The Thing checklist appears at the steading after the first thaw and names exactly what a jarl still lacks. Ruling is not the end: a jarl is owed a portion each season by every neighbour glad of him, and men come to serve a name — but harder men come with them."}];function yb(e){const t=(o,a,r)=>{const i=x("",r,{class:"settings-row"});return i.append(h("span",{class:"settings-name"},[o]),h("span",{class:"settings-value"},[a])),i},n=h("div",{class:"card settings-card"},[h("h2",{},["Settings"]),t("Sound",e.muted?"Off":"On",e.onToggleSound),t("Motion",e.motionStill?"Kep an others — and the days are what run out first.",point:"Walk on up the coast, or open the Chart and tap a stretch. Tap Act for everything else you can do with a day."},when:[{c:"dayMin",day:2}]},{id:"the-store",title:"The Store",body:"The sacks came down faster than anyone had reckoned on. Six people eat whether the day went well or badly, and a night without a fire costs more than a day without food.",point:"Forage, hunt and fish put food back. Camp gathers firewood. Both cost the day.",when:[{c:"foodMax",value:12}]},{id:"the-ground",title:"Ground Worth Holding",body:"This is the kind of place a man could put posts in. The reading under the map is what the land is actually good for — and no two good things ever come together, so the choice is which lack you can live with.",point:"Founding is one way and there is no second steading. Without fresh water it is refused outright.",when:[{c:"canSettle"}]},{id:"the-mark",title:"The Mark",body:"The light is going earlier and the old hands have started counting sacks out loud. What the mark shows is not a rule of thumb — it walks every remaining day with your people on their jobs and tells you what the stores must reach.",point:"Reach the mark before the dark. A band that ignores it usually does not see spring.",when:[{c:"markVisible"}]},{id:"the-work",title:"The Work",body:"The posts are in, and from here the steading is where the band lives. Everyone gets a job or wastes the day, and the ground decides which jobs are worth anything: you cannot farm a crag or cut timber on a shore.",point:"Give everyone work. Queue what you lack. Builders turn timber into what the winter cannot take.",when:[{c:"inColony"}]},{id:"the-line",title:"The Line",body:"They came on faster than anyone could form up. A man alone with his shield is a man being flanked; two standing shoulder to shoulder are worth more than three scattered across the field.",point:"Stand your people next to each other. The wall is worth more than any single blow.",when:[{c:"inBattle"}]},{id:"the-road",title:"The Road Out",body:"They took provisions and went, and the steading closed up behind them. Whoever stayed works every day they are gone, and whoever went is the only part of the band the country can reach.",point:"A hall whose warriors are three days out is the one worth raiding. Send what you can spare.",when:[{c:"away"}]},{id:"the-quarrel",title:"Bad Blood",body:"It started over nothing, the way these things do, and by the second week nobody was pretending otherwise. Hunger and cold and bad work make quarrels; the quarrels do not go away because the weather improved.",point:"Settle it, or it comes to knives. A quarrel the band refused to name hardens instead of fading.",when:[{c:"grudge"}]},{id:"the-hands",title:"Hands",body:"They came with nothing and were put to work by noon. A hand is not sworn: they hold jobs, eat at the fire, and need a bed under a roof. They do not walk out under arms with the band — but when a raid comes to the yard they take up what is to hand and stand with everyone else, because it is their hall too. The line is still six wide. A hand who is miserable long enough walks out.",point:"Growth buys labour, never a wider wall. Build room before you take people in, and keep their hearts up.",when:[{c:"hasHands"}]},{id:"the-place",title:"Somewhere That Is Somewhere",body:"The country is not empty. A house of the White Christ, a trading town, a wreck, a seam of iron — places worth walking to, and some worth taking. What is taken is taken once, and word of an armed band travels faster than the band does.",point:"Open Act while standing on a place to take what it holds. The guarded ones pay best and cost most.",when:[{c:"atPlace"}]},{id:"the-hull",title:"What the Sea Took",body:"She is making water where the strake sprang, and half of every stroke is spent baling. A holed hull is not a sunk one — but she will not run, and she will not fight well, until she has been over on a beach with somebody who knows hulls.",point:"Camp ashore to mend her. It takes a night and a little timber, and she swims like herself after.",when:[{c:"holed"}]},{id:"the-word",title:"Word Travels",body:"The men who came at us knew the name of this band before steel was out. Stand long enough, or take enough, and the coast starts sending people who have heard — and the ones who come looking for famous men are not scouts.",point:"Fame is bought with winters and with sackings. Harder fights are the price of both.",when:[{c:"famous"}]},{id:"the-thing",title:"The Thing",body:"Two winters stood, and men on this coast have started saying the name of this place as if it were somewhere. A jarl is not a man who declares himself one — he is a man an assembly will carry.",point:"Everything the Thing asks for is a system you already run. The checklist says which one is short.",when:[{c:"couldClaim"}]}];new Map(Cl.map(e=>[e.id,e]));function Bb(e,t){switch(t.c){case"inBattle":return!!e.battle&&!e.battle?.outcome;case"inColony":return fe(e)==="COLONY";case"canSettle":return!e.settlement&&Vt(e);case"markVisible":return Oo(e);case"grudge":return e.grudges.some(n=>!n.settled);case"away":return!!e.expedition;case"couldClaim":return!!e.settlement&&V(e.day)>=nn;case"atPlace":return!!(eo(e)?.sackedOn===void 0&&eo(e));case"hasHands":return mo(e.party.people).length>0;case"holed":return jt(e.ship);case"famous":return Ht(e)>0;default:return Hd(e,t)}}function Db(e){return!e.event&&!e.aftermath&&!e.end&&!e.battle?.outcome}function Hb(e){return e.day>1}function Fb(e,t){if(!Db(e)||!Hb(e))return;const n=new Set(t);return Cl.find(o=>!n.has(o.id)&&o.when.every(a=>Bb(e,a)))}const Sr="landnam_taught";function Ar(){return _t(Sr,ky,[])}function Pb(e){const t=Ar();t.includes(e)||bt(Sr,[...t,e])}function Gb(){by(Sr)}const Bl="landnam_fallen",jb=60,qb=e=>Array.isArray(e)&&e.every(Ub);function xa(){return _t(Bl,qb,[])}function Ub(e){if(typeof e!="object"||e===null)return!1;const t=e;return typeof t.name=="string"&&typeof t.byname=="str
