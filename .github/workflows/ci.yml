name: CI

# Work branches, and pull requests. Deliberately NOT main.
#
# This used to be branches: ['**']. Every change is pushed to the work branch
# AND to main, so one change spawned two identical runs of the same commit —
# and on a congested runner pool those sat in the queue ahead of the `pages
# build and deployment` run that decides whether the site updates at all.
#
# Main is the deploy branch, so a push to it must have the runner pool to
# itself. The commit is already verified by the time it lands there: it is the
# same SHA CI ran on the work branch a moment earlier. Testing it twice is not
# worth starving the deploy.
on:
  push:
    # Everywhere EXCEPT the deploy branch, stated as the rule itself rather
    # than as a pattern that has to match the branch names we happen to use.
    # An earlier attempt said branches: ['claude/**'] and matched nothing at
    # all — three pushes to the work branch produced no CI run whatsoever,
    # which is a worse failure than the double-run it was fixing, because it
    # is silent.
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

# A push supersedes the one before it. Without this every push leaves its CI
# run queued forever, and on a busy runner pool those stale runs sit ahead of
# the deploy that actually matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # How many cores this runner actually has, printed rather than assumed.
      #
      # `vite.config.ts` has said "a two-core CI runner" since Phase 5, and it
      # is load-bearing: vitest sizes its fork pool as `max(cpus - 1, 1)`, so
      # two cores means ONE fork and the suite runs serially, while four means
      # three forks running at once. That difference decides whether this job
      # can hit the `[vitest-worker]: Timeout calling "onTaskUpdate"` error
      # that two concurrent CPU-bound files reproduce locally. The number was
      # inherited and never re-taken, which is the one thing CLAUDE.md asks
      # nobody to do with a number. One line makes it a reading.
      - run: node -e "console.log('ci cores:', require('node:os').availableParallelism(), '-> vitest maxForks:', Math.max(require('node:os').availableParallelism() - 1, 1))"
      - run: npx tsc --noEmit
      # The game, and since 8.5 there is only one of it. A second suite ran
      # here against `VITE_HEX=1` while the conversion had two builds over one
      # tree; the hex build was deleted on 2026-08-28 and went with it.
      - run: npm test
      # The single-file constraint is load-bearing: release.mjs fails the
      # build if dist/index.html is not self-contained.
      - run: npm run release
