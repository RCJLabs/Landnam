name: CI

# Only main, and pull requests.
#
# This used to be branches: ['**']. Every change is pushed to the feature
# branch AND to main, so one change spawned two identical runs of the same
# commit — and on a congested runner pool those sat in the queue ahead of the
# `pages build and deployment` run that decides whether the site updates at
# all. Testing the same SHA twice is not worth starving the deploy.
on:
  push:
    branches: [main]
  pull_request:

# A push supersedes the one before it. Without this every push leaves its CI
# run queued forever, and on a busy runner pool those stale runs sit ahead of
# the deploy that actually matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # The single-file constraint is load-bearing: release.mjs fails the
      # build if dist/index.html is not self-contained.
      - run: npm run release
