name: Deploy

# Publishes the single-file build to the gh-pages branch.
# Enable once in Settings -> Pages -> Deploy from a branch -> gh-pages / root.

on:
  push:
    branches: [claude/viking-game-brainstorm-syr6rn, main]
  workflow_dispatch:

permissions:
  contents: write

# Deploys queue; they never cancel each other.
#
# This was `cancel-in-progress: true`, on the reasoning that only the newest
# build matters. That is true right up until three pushes land while runners
# are slow: each one cancels the one before it, none of them ever reaches the
# runner, and the live site sits on whatever last succeeded. It did exactly
# that on 2026-08-06 — the site stayed two feature-commits behind for 54
# minutes while three deploys chain-cancelled each other, which read from the
# outside as "the deploy is broken".
#
# Serialised, a burst costs a few minutes of latency and every commit lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      # Stamp every deploy so the gh-pages tree always changes. Without this,
      # an identical build produces no commit, Pages never rebuilds, and a
      # stale deployment silently stays live.
      - name: Stamp the build
        run: echo "${{ github.sha }} $(date -u +%FT%TZ)" > dist/build.txt
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
